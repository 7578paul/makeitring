trade: moving
version: 1.0-from-account
source: extracted from the live Moving Papa Google Ads account
structure: 'campaigns are built per market: ''{market} | Search | {theme}'''
defaults:
  campaign_type: Search
  campaign_name_format: '{market} | Search | {label}'
  networks: Google search
  language: en
  bid_strategy: Maximize conversions
  location_target_type: Location of presence
  location_exclusion_type: Location of presence
  tracking_template: '{lpurl}?campaign={campaignid}&content={creative}&keyword={keyword}'
  ad_rotation: Optimize for clicks
  status: Paused
  match_types:
  - phrase
  target_cpa_note: taken from the live account, not invented
budget:
  min_daily: 50.0
  days_per_month: 30.4
negatives:
  account_level:
    from_file: _shared/negatives-universal.txt
    match_type: phrase
    themes: []
  competitor_wall:
    from_file: _shared/negatives-competitors.txt
    match_type: exact
themes: {}
assets:
