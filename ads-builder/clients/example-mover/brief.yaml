# Client brief — everything that differs between accounts lives here.
# Nothing in this file describes *how* to build a moving account; that is the
# blueprint's job. If a field is missing the build fails rather than guessing.

client:
  slug: example-mover
  business_name: "Redline Moving"
  website: "https://redlinemoving.example"
  phone: "+1 416 555 0134"
  currency: CAD
  timezone: America/Toronto
  customer_id: "123-456-7890"      # Google Ads account, once the MCC invite is accepted

trade: moving

# Which blueprint campaigns to switch on. Anything not listed is skipped, so the
# same blueprint serves a two-truck local outfit and a national carrier.
services:
  - brand
  - local_moving
  - long_distance
  - commercial

service_area:
  # Cities become ad groups, keywords and ad copy. Order matters: the first is
  # treated as the home city and used in fallback copy.
  cities:
    - Toronto
    - Mississauga
    - Vaughan
    - Markham
  # Geo targeting sent to Google. `presence` only — never presence-or-interest.
  targets:
    - "Toronto, Ontario, Canada"
    - "Mississauga, Ontario, Canada"
    - "Vaughan, Ontario, Canada"
    - "Markham, Ontario, Canada"
  exclude: []

budget:
  monthly_total: 6000            # in `client.currency`
  # Optional per-campaign override of the blueprint's weights, 0-100.
  # Anything omitted falls back to the blueprint default.
  weights:
    long_distance: 45

hours:
  # Used for ad scheduling. 24/7 trades (restoration) just say `always: true`.
  always: false
  open:
    mon_fri: ["07:00", "19:00"]
    sat: ["08:00", "17:00"]
    sun: null

positioning:
  min_job_value: "$450 minimum"
  offer: "Free in-home estimate"
  usps:
    - "Licensed and insured"
    - "No hidden fees"
    - "Same crew start to finish"
  # Brand terms to defend, and competitors to never bid on by mistake.
  brand_terms:
    - "redline moving"
    - "redline movers"

landing_pages:
  # Per-campaign final URLs. `default` catches anything unmapped.
  default: "https://redlinemoving.example/"
  local_moving: "https://redlinemoving.example/local-movers"
  long_distance: "https://redlinemoving.example/long-distance"
  commercial: "https://redlinemoving.example/commercial"

tracking:
  # See PLAN.md § measurement. Filled in during onboarding, checked pre-launch.
  gclid_capture: true
  call_tracking: pending          # pending | configured
  ga4_measurement_id: null
  conversion_actions:
    - key: form_submit
      source: ga4_import
      primary: true
    - key: call_from_ads
      source: google_forwarding_number
      primary: true
      min_duration_seconds: 60
