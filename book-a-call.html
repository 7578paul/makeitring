<body>
<div class="stage">
  <div class="sheet">
    <img src="images/logo-make-it-ring.svg" alt="Make It Ring" style="height:20px;width:auto;display:block;margin:0 0 26px">

    <div id="lead-success" hidden>
    <h1 style="font-size:clamp(28px, 6.4vw, 40px);line-height:1.05;letter-spacing:-0.045em;font-weight:900;margin:0 0 16px">Got it. <span style="color:var(--accent)">We'll be in touch</span> within the hour.</h1>
      <p style="font-size:18.5px;line-height:1.6;color:#666;margin:0 0 26px">Calls come from (647) 475-2404. Outside 7am to 7pm it will be first thing in the morning.</p>
      <a href="index.html" style="display:inline-flex;align-items:center;height:52px;padding:0 24px;border-radius:999px;background:#111;color:#fff;font-weight:700;font-size:17.5px">Back to the site</a>
    </div>

    <p class="vetted"><span class="vetted-stars" aria-hidden="true"><span style="color:#4285F4">&#9733;</span><span style="color:#EA4335">&#9733;</span><span style="color:#FBBC05">&#9733;</span><span style="color:#34A853">&#9733;</span><span style="color:#4285F4">&#9733;</span></span><span>Google Ads certified</span></p>
    <h1 id="lead-form-title" style="font-size:clamp(28px, 6.4vw, 40px);line-height:1.05;letter-spacing:-0.045em;font-weight:900;margin:0 0 26px">Where should we send <span style="color:var(--accent)">the findings</span>?</h1>
    <form data-lead-form="lead-success" id="lead-form" style="display:grid;gap:14px">
      <label class="field"><span style="font-size:15.5px;font-weight:600;color:#666">Name</span><input name="name" data-label="name" required autocomplete="name"></label>
      <label class="field"><span style="font-size:15.5px;font-weight:600;color:#666">Company</span><input name="company" data-label="company" required autocomplete="organization"></label>
      <label class="field"><span style="font-size:15.5px;font-weight:600;color:#666">Phone</span><input name="phone" type="tel" data-label="phone number" required autocomplete="tel"></label>
      <label class="field"><span style="font-size:15.5px;font-weight:600;color:#666">Email</span><input name="email" type="email" data-label="email address" required autocomplete="email"></label>
      <label class="field"><span style="font-size:15.5px;font-weight:600;color:#666">Monthly ad spend</span><select name="spend" data-label="monthly ad spend" data-spend-fill required style="height:52px;font-size:18px;padding:0 16px;border:1.5px solid #d8d8d4;border-radius:999px;background:#fff;color:#111;outline:none;appearance:none;-webkit-appearance:none"><option value="">Choose your monthly spend</option><option value="0-5k">$0 to $5k a month</option><option value="5-10k">$5k to $10k a month</option><option value="10k+">$10k+ a month</option></select></label>
      <button type="submit" style="width:100%;height:56px;margin-top:6px;background:var(--accent);color:#fff;border:0;border-radius:999px;font-weight:700;font-size:18.5px;cursor:pointer">Book</button>
    </form>
  </div>
</div>

<script src="assets/js/site.js" defer></script>
<script>
  // Hide the form's own heading when the success panel takes over.
  document.addEventListener("DOMContentLoaded", function () {
    var form = document.getElementById("lead-form");
    var title = document.getElementById("lead-form-title");
    var obs = new MutationObserver(function () {
      if (form.hidden) title.hidden = true;
    });
    obs.observe(form, { attributes: true, attributeFilter: ["hidden"] });
  });
</script>
</body>
</html>
